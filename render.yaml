# Render.com Deployment Configuration
# Using Docker for full control

services:
  - type: web
    name: sentiment-dashboard-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NEWS_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
    healthCheckPath: /health
