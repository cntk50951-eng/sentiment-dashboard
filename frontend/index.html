<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Dashboard - AI Investment Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
    <!-- Header -->
    <header class="glass fixed top-0 left-0 right-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center glow">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold gradient-text">Sentiment Dashboard</h1>
                    <p class="text-xs text-slate-400 mono">AI-Powered Investment Intelligence</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 pulse"></div>
                    <span class="text-xs text-emerald-400 mono">LIVE</span>
                </div>
                <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm font-medium transition-colors">
                    AI Agent
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-24 pb-12 px-6 max-w-7xl mx-auto">
        <!-- Stats Overview -->
        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="glass rounded-xl p-4 glow">
                <div class="text-slate-400 text-xs mb-1">Active Topics</div>
                <div class="text-2xl font-bold text-cyan-400 mono" id="active-topics">0</div>
                <div class="text-xs text-emerald-400 mt-1">+12 this hour</div>
            </div>
            <div class="glass rounded-xl p-4">
                <div class="text-slate-400 text-xs mb-1">Bullish Sentiment</div>
                <div class="text-2xl font-bold text-emerald-400 mono" id="bullish-pct">0%</div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 mt-2">
                    <div class="bg-emerald-500 h-1.5 rounded-full" style="width: 65%"></div>
                </div>
            </div>
            <div class="glass rounded-xl p-4">
                <div class="text-slate-400 text-xs mb-1">Bearish Sentiment</div>
                <div class="text-2xl font-bold text-rose-400 mono" id="bearish-pct">0%</div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 mt-2">
                    <div class="bg-rose-500 h-1.5 rounded-full" style="width: 25%"></div>
                </div>
            </div>
            <div class="glass rounded-xl p-4">
                <div class="text-slate-400 text-xs mb-1">Opportunities</div>
                <div class="text-2xl font-bold text-amber-400 mono" id="opportunities">0</div>
                <div class="text-xs text-slate-500 mt-1">AI Identified</div>
            </div>
        </div>

        <!-- Hot Topics Section -->
        <div class="grid grid-cols-3 gap-6">
            <!-- Hot Topics List -->
            <div class="col-span-2 glass rounded-xl p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-500 pulse"></span>
                        🔥 Hot Topics
                    </h2>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" onclick="filterTopics('all')">All</button>
                        <button class="px-3 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" onclick="filterTopics('stock')">Stocks</button>
                        <button class="px-3 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" onclick="filterTopics('crypto')">Crypto</button>
                    </div>
                </div>
                <div id="topics-list" class="space-y-3 max-h-[600px] overflow-y-auto scroll-hide">
                    <!-- Topics will be loaded here -->
                    <div class="text-center text-slate-500 py-8">Loading...</div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="space-y-6">
                <!-- Trending Tickers -->
                <div class="glass rounded-xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                        📈 Trending Tickers
                    </h3>
                    <div id="trending-tickers" class="space-y-2">
                        <!-- Tickers will be loaded here -->
                    </div>
                </div>

                <!-- Sentiment Distribution -->
                <div class="glass rounded-xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4">Sentiment Distribution</h3>
                    <div class="space-y-3">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-emerald-400">Bullish</span>
                                <span class="text-emerald-400 mono">65%</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-emerald-500 h-2 rounded-full transition-all" style="width: 65%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-slate-400">Neutral</span>
                                <span class="text-slate-400 mono">20%</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-slate-500 h-2 rounded-full transition-all" style="width: 20%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-rose-400">Bearish</span>
                                <span class="text-rose-400 mono">15%</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-rose-500 h-2 rounded-full transition-all" style="width: 15%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AI Agent Panel -->
                <div class="glass rounded-xl p-6 glow">
                    <h3 class="text-sm font-semibold text-cyan-400 mb-4 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                        AI Agent
                    </h3>
                    <div class="space-y-3">
                        <input 
                            type="text" 
                            id="agent-query"
                            placeholder="Ask AI about market trends..."
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-cyan-500 transition-colors"
                        >
                        <button 
                            onclick="askAgent()"
                            class="w-full py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 rounded-lg text-sm font-medium transition-all"
                        >
                            Analyze
                        </button>
                    </div>
                    <div id="agent-response" class="mt-4 p-3 bg-slate-900/50 rounded-lg text-xs text-slate-300 hidden">
                        <!-- Agent response will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:8000/api';
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadHotTopics();
            loadTrendingTickers();
            updateStats();
            
            // Refresh every 30 seconds
            setInterval(() => {
                loadHotTopics();
                updateStats();
            }, 30000);
        });
        
        // Load hot topics
        async function loadHotTopics() {
            try {
                const response = await fetch(`${API_BASE}/hot-topics`);
                const data = await response.json();
                
                const container = document.getElementById('topics-list');
                container.innerHTML = data.topics.map(topic => `
                    <div class="p-4 bg-slate-900/50 rounded-lg hover:bg-slate-800/50 transition-colors cursor-pointer group">
                        <div class="flex items-start gap-3">
                            <div class="w-2 h-2 rounded-full mt-2 ${getSentimentColor(topic.sentiment)}"></div>
                            <div class="flex-1">
                                <h4 class="text-sm font-medium text-slate-200 group-hover:text-cyan-400 transition-colors">
                                    ${topic.title}
                                </h4>
                                <div class="flex items-center gap-3 mt-2 text-xs text-slate-500">
                                    <span class="mono">👍 ${topic.mentions?.toLocaleString() || 0}</span>
                                    <span class="mono">💬 ${topic.comments?.toLocaleString() || 0}</span>
                                    <span class="text-slate-600">${topic.source}</span>
                                    ${topic.related_tickers?.map(t => `
                                        <span class="px-1.5 py-0.5 bg-slate-800 rounded text-cyan-400 mono">$${t}</span>
                                    `).join('')}
                                </div>
                                ${topic.potential_opportunity ? `
                                    <div class="mt-2 p-2 bg-amber-500/10 border border-amber-500/30 rounded text-xs text-amber-400">
                                        💡 ${topic.potential_opportunity}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading topics:', error);
                document.getElementById('topics-list').innerHTML = `
                    <div class="text-center text-rose-400 py-8">
                        Failed to load data. Please try again.
                    </div>
                `;
            }
        }
        
        // Load trending tickers
        async function loadTrendingTickers() {
            // Mock data for now
            const tickers = [
                { ticker: 'NVDA', mentions: 156, sentiment: 0.75 },
                { ticker: 'TSLA', mentions: 134, sentiment: 0.45 },
                { ticker: 'AAPL', mentions: 98, sentiment: 0.62 },
                { ticker: 'BTC', mentions: 87, sentiment: 0.58 },
                { ticker: 'ETH', mentions: 76, sentiment: 0.52 },
            ];
            
            const container = document.getElementById('trending-tickers');
            container.innerHTML = tickers.map(t => `
                <div class="flex items-center justify-between p-2 hover:bg-slate-800/50 rounded transition-colors">
                    <div class="flex items-center gap-2">
                        <span class="mono text-sm font-medium text-slate-300">$${t.ticker}</span>
                        <span class="text-xs text-slate-500">${t.mentions} mentions</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <span class="text-xs ${t.sentiment > 0.5 ? 'text-emerald-400' : 'text-rose-400'}">
                            ${t.sentiment > 0.5 ? '🟢' : '🔴'}
                        </span>
                        <span class="text-xs text-slate-400 mono">${(t.sentiment * 100).toFixed(0)}%</span>
                    </div>
                </div>
            `).join('');
        }
        
        // Update stats
        function updateStats() {
            document.getElementById('active-topics').textContent = '47';
            document.getElementById('bullish-pct').textContent = '65%';
            document.getElementById('bearish-pct').textContent = '15%';
            document.getElementById('opportunities').textContent = '8';
        }
        
        // Get sentiment color
        function getSentimentColor(score) {
            if (score > 0.3) return 'bg-emerald-500';
            if (score < -0.3) return 'bg-rose-500';
            return 'bg-slate-500';
        }
        
        // Filter topics
        function filterTopics(type) {
            // Implementation for filtering
            console.log('Filter by:', type);
        }
        
        // Ask AI Agent
        async function askAgent() {
            const query = document.getElementById('agent-query').value;
            if (!query) return;
            
            const responseDiv = document.getElementById('agent-response');
            responseDiv.classList.remove('hidden');
            responseDiv.innerHTML = '<div class="text-cyan-400">Analyzing...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/agent/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                responseDiv.innerHTML = `
                    <div class="text-cyan-400 font-medium mb-2">AI Analysis:</div>
                    <div class="text-slate-300">${data.summary}</div>
                `;
            } catch (error) {
                responseDiv.innerHTML = '<div class="text-rose-400">Analysis failed. Please try again.</div>';
            }
        }
    </script>
</body>
</html>
